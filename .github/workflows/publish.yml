name: publish to marketplaces

# Publicar é criar a tag imutável no canônico e apontar a entrada de cada
# marketplace para ela. Nenhum conteúdo é copiado: o source é git-subdir.
on:
  push:
    branches: [main]
    paths:
      - "plugin/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-marketplaces
  cancel-in-progress: false

jobs:
  release:
    name: Tag da release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      ref: ${{ steps.resolve.outputs.ref }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      # PRs já exigem o bump; esta segunda fronteira cobre push direto em main
      # antes de qualquer tag imutável ou escrita em marketplace.
      - name: Exigir bump antes de publicar
        if: ${{ github.event_name == 'push' }}
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: python tests/check_version_bump.py --base-ref "$BASE_SHA" --head-ref "$HEAD_SHA"

      - name: Resolver versão e commit
        id: resolve
        run: |
          version=$(python3 -c "import json;print(json.load(open('plugin/.claude-plugin/plugin.json'))['version'])")
          sha=$(git rev-parse HEAD)
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'ref=v%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

      # Uma tag publicada é imutável: reescrevê-la mudaria o que já foi
      # distribuído a quem instalou aquela versão.
      - name: Criar a tag, recusando remarcação
        env:
          REF: ${{ steps.resolve.outputs.ref }}
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          # `|| true` aqui captura "tag ainda não existe", que é o caso normal e
          # faria o passo abortar sob `bash -e`. Não engole falha de gate: a
          # divergência de commit abaixo reprova explicitamente.
          existing=$(git rev-parse -q --verify "refs/tags/$REF^{commit}" || true)
          if [ -n "$existing" ]; then
            if [ "$existing" != "$SHA" ]; then
              echo "::error::$REF já existe em $existing e a publicação pede $SHA; tag publicada é imutável"
              exit 1
            fi
            echo "$REF já aponta para $SHA; nada a criar"
            exit 0
          fi
          git config user.name "grill-with-docs release"
          git config user.email "release@users.noreply.github.com"
          git tag -a "$REF" -m "$REF" "$SHA"
          git push origin "refs/tags/$REF"

      # Tag sem release é publicação incompleta: quem acompanha releases não vê a
      # versão sair. A release é derivada da tag imutável, então encontrá-la já
      # criada é o estado desejado de uma reexecução, não conflito.
      - name: Criar a release da tag, sem sobrescrever
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ steps.resolve.outputs.ref }}
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          # `|| true` captura "release ainda não existe", que é o caso normal de
          # uma versão nova e faria o passo abortar sob `bash -e`. Não engole
          # falha de gate: a divergência de commit abaixo reprova explicitamente.
          existing=$(gh release view "$REF" --json tagName -q .tagName 2>/dev/null || true)
          if [ -n "$existing" ]; then
            echo "release $REF já existe; nada a criar"
          else
            # --verify-tag recusa criar release órfã, sem tag que a ancore.
            gh release create "$REF" --title "$REF" --generate-notes --verify-tag
          fi
          # A release herda o commit da tag, então conferir a tag é conferir a
          # release — e prova que o que foi anunciado é o que foi verificado.
          anchored=$(git rev-parse -q --verify "refs/tags/$REF^{commit}")
          if [ "$anchored" != "$SHA" ]; then
            echo "::error::release $REF está ancorada em ${anchored:-nada} e a publicação declara $SHA"
            exit 1
          fi
          echo "release $REF ancorada em $SHA"

  publish:
    name: Publicar em ${{ matrix.target }}
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: claude
            repo: cadugevaerd/claude-skills
          - target: codex
            repo: cadugevaerd/codex-skills
    steps:
      - name: Checkout do canônico
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      # O token vai por cabeçalho, nunca na URL do remote: uma URL com segredo
      # fica gravada em .git/config e vaza em qualquer log que a imprima.
      - name: Clonar o marketplace
        env:
          TOKEN: ${{ secrets.MARKETPLACE_PUBLISH_TOKEN }}
          REPO: ${{ matrix.repo }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::secret MARKETPLACE_PUBLISH_TOKEN ausente"
            exit 1
          fi
          header=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          echo "::add-mask::$header"
          printf 'AUTH_HEADER=%s\n' "$header" >> "$GITHUB_ENV"
          git -c http.extraheader="AUTHORIZATION: basic $header" \
              clone --depth 1 "https://github.com/$REPO.git" marketplace

      - name: Apontar a entrada para a release
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.release.outputs.version }}
          REF: ${{ needs.release.outputs.ref }}
          SHA: ${{ needs.release.outputs.sha }}
        run: |
          python3 tests/publish_to_marketplace.py \
            --target "$TARGET" --checkout marketplace \
            --version "$VERSION" --ref "$REF" --sha "$SHA" --apply --json

      - name: Commitar e empurrar somente se mudou
        env:
          REPO: ${{ matrix.repo }}
          REF: ${{ needs.release.outputs.ref }}
        working-directory: marketplace
        run: |
          if git diff --quiet; then
            echo "$REPO já aponta para $REF; nada a empurrar"
            exit 0
          fi
          git config user.name "grill-with-docs release"
          git config user.email "release@users.noreply.github.com"
          git commit -am "chore(grill-with-docs): aponta para $REF"
          git -c http.extraheader="AUTHORIZATION: basic $AUTH_HEADER" push origin HEAD

      # Um push aceito prova que o remote respondeu, não que o destino serve a
      # release. Conferir o arquivo que este job acabou de editar atestaria só a
      # edição em memória do runner, então a releitura vem de um clone novo.
      # Roda mesmo quando nada foi empurrado: aí ela confirma que o destino já
      # estava em dia, que é o caso de reexecução.
      - name: Verificar o estado publicado
        env:
          TARGET: ${{ matrix.target }}
          REPO: ${{ matrix.repo }}
          VERSION: ${{ needs.release.outputs.version }}
          REF: ${{ needs.release.outputs.ref }}
          SHA: ${{ needs.release.outputs.sha }}
          CANONICAL: https://github.com/cadugevaerd/grill-with-docs.git
        run: |
          rm -rf marketplace-verify
          git -c http.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
              clone --depth 1 "https://github.com/$REPO.git" marketplace-verify
          python3 tests/publish_to_marketplace.py \
            --target "$TARGET" --checkout marketplace-verify \
            --version "$VERSION" --ref "$REF" --sha "$SHA" --verify --json

          # A referência publicada precisa resolver para o commit publicado na
          # visão de quem instala o plugin — e quem instala não tem o segredo,
          # por isso a consulta ao canônico é anônima.
          listing=$(git ls-remote "$CANONICAL" "refs/tags/$REF" "refs/tags/$REF^{}")
          # Tag anotada expõe o commit na linha peeled; leve, na própria linha.
          resolved=$(printf '%s\n' "$listing" | awk '$2 ~ /\^\{\}$/ {print $1}')
          [ -n "$resolved" ] || resolved=$(printf '%s\n' "$listing" | awk 'NR==1 {print $1}')
          if [ "$resolved" != "$SHA" ]; then
            echo "::error::$REF resolve para ${resolved:-nada} e a publicação declara $SHA"
            exit 1
          fi
          echo "$REPO serve $VERSION e $REF resolve para $SHA"
