name: version bump gate

# Sem `paths:` de propósito. O filtro de caminhos é declarado no nível do
# workflow, e um workflow pulado não reporta status nenhum — então um gate
# filtrado não pode ser exigido como required check sem prender para sempre
# toda PR que ele não avalia. Rodar sempre custa segundos e produz veredito
# real: `check_version_bump.py` responde NO-PLUGIN-CHANGE quando `plugin/`
# não mudou, o que é aprovação por verificação, não por ausência dela.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: bump-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  bump-gate:
    name: Version bump gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # fetch-depth: 0 is mandatory: the default shallow clone does not contain
      # the merge base, so `git show <base>:<file>` would fail.
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      # On pull_request the checkout is an ephemeral merge commit, so the base
      # must come from the event payload SHA, never from a branch name.
      - name: Enforce version bump
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: python tests/check_version_bump.py --base-ref "$BASE_SHA"
