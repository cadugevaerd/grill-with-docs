name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run validators
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          for test in tests/validate_*.py; do
            python "$test"
          done
