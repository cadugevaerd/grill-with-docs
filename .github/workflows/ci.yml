name: grill-with-docs portability

on:
  pull_request:
    paths:
      - "plugin/**"
      - "tests/**"
      - ".agents/plugins/marketplace.json"
      - ".claude-plugin/marketplace.json"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "plugin/**"
      - "tests/**"
      - ".agents/plugins/marketplace.json"
      - ".claude-plugin/marketplace.json"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: grill-with-docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    # O evento pull_request já testa `refs/pull/N/merge`, que é exatamente a
    # árvore que o merge deposita na main — então o push subsequente repetiria
    # a matriz inteira sobre conteúdo idêntico. O gatilho de push continua,
    # porque este repo também empurra direto para a main e aí ele é a única
    # cobertura. A guarda é fail-safe: mensagem que não casar apenas roda de
    # novo, nunca deixa de rodar.
    #
    # Ressalva: se uma PR desatualizada em relação à base for mergeada, a
    # árvore resultante pode diferir da que a PR testou. Exigir branch
    # atualizada no branch protection fecha isso (ver SGD-4).
    if: >-
      github.event_name == 'pull_request' ||
      !startsWith(github.event.head_commit.message, 'Merge pull request ')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.10"
            suite: essential
          - os: windows-2025
            python: "3.13"
            suite: portability
          - os: macos-26
            python: "3.13"
            suite: portability
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}

      - name: Run CI validators
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python tests/run_validators.py --suite ${{ matrix.suite }}

# O gate de bump mora em `.github/workflows/bump-gate.yml`, sem filtro de
# caminhos. Ele saiu daqui porque `paths:` é declarado no nível do workflow:
# enquanto vivesse neste arquivo, herdaria o filtro da matriz e ficaria mudo nas
# PRs que não o casam — e um required check mudo prende a PR para sempre.
