# Agent Assignments
# Feature: 012-durable-run-state
# Command contract: speckit.agent-assign.assign
# Execution runtime: Codex native agents only; no Claude invocation.

assignment_policy:
  max_workers: 5
  runtime: codex-native
  documentation_tier: small
  implementation_and_test_tier: medium
  planning_and_review_tier: large
  concurrent_writer_rule: distinct files only; otherwise serialize
  scheduler: unavailable-in-FASE-002

agents_scanned:
  - name: "Minimal Change Engineer"
    source: user-agent-definition
    description: "Minimum-scope Python implementation specialist."
  - name: "Test Results Analyzer"
    source: user-agent-definition
    description: "Contract test and evidence specialist."
  - name: "Document Generator"
    source: user-agent-definition
    description: "Markdown/documentation maintenance specialist."
  - name: "Backend Architect"
    source: user-agent-definition
    description: "Durable state and transaction architecture specialist."
  - name: "Code Reviewer"
    source: user-agent-definition
    description: "Independent correctness and security reviewer."

