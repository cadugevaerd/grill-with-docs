# Gate reports and the two append-only checkpoint files do not alter reviewed
# implementation. Work Item authorities (handoffs, plans, ADRs) stay included.
converge:
  # NAO comente entre os itens da lista abaixo: o coletor de
  # scripts/source-fingerprint.sh para na primeira linha que nao seja item, e
  # um comentario no meio descarta em silencio tudo o que vier depois dele.
  #
  # `.grill/attestations/**` esta aqui pela mesma razao que `verify.md`: um
  # bundle de atestacao e evidencia SOBRE a revisao, nao conteudo revisado. Sob
  # o protocolo grill, fechar uma etapa de gate escreve um bundle ali; conta-lo
  # como fonte faz `verify` invalidar o proprio relatorio, e rodar de novo so
  # produz outro bundle. Laco, nao deteccao.
  # `.grill/attestations/**` nunca casou nada: sob o protocolo grill os bundles
  # ficam em `.grill/work-items/<work_id>/attestations/`, nao na raiz de
  # `.grill/`. Sem o padrao correto, o laco que o comentario acima descreve
  # acontecia de fato -- `ship` recusava por STALE-EVIDENCE porque `verify` e
  # `review` cunharam, cada um, o proprio receipt entre as duas medicoes. A
  # autorizacao humana de `ship` entra pela mesma razao: e evidencia SOBRE a
  # entrega, escrita depois que `review` mediu.
  #
  # Comentario nenhum pode ficar ENTRE os itens abaixo: o leitor da config para
  # de coletar na primeira linha nao-vazia que nao e item de lista, entao um
  # comentario interleaved descarta silenciosamente tudo o que vem depois dele.
  fingerprint_exclude:
    - ".specify/reports/verify-review-ship/**"
    - "specs/**/verify.md"
    - "specs/**/review.md"
    - ".grill/work-items/**/state.json"
    - ".grill/work-items/**/ROUND-LOG.jsonl"
    - ".grill/attestations/**"
    - ".grill/work-items/**/attestations/**"
    - ".grill/work-items/**/SHIP-AUTHORIZATION.json"

# Ship. Adaptado a este repositorio, nao copiado do template: o backlog e
# externo (backlogctl/SGD, sem BACKLOG.md) e os ADRs vivem por work item em
# .grill/work-items/<id>/docs/adr, nao num docs/adr da raiz. Rotear aprendizado
# para esses caminhos do template escreveria no lugar errado.
ship:
  require_verify_report: true
  require_review_report: true
  require_rollback_plan: true
  require_monitoring_notes: true
  default_decision_on_critical: "NO-GO"
  remote: "origin"
  base_branch: "main"
  merge_strategy: "no-ff"
  require_clean_worktree: true
  rerun_integration_gates: true
  learning_gate:
    enabled: true
    require_human_approval: true
    require_evidence: true
    deduplicate: true
    auto_commit_versioned_changes: true
    rerun_analyze_on_constitution_change: true
    rerun_verify_review: true
    # adr-docs e backlog ficam de fora: nao ha destino estatico valido neste
    # repositorio, e um fallback silencioso escreveria no lugar errado.
    allow_targets: ["agent-context", "memory", "discard"]
    context_section_heading: "Project Learnings"
  memory:
    mode: "propose-only"
    write_after_verified_merge: true
    required: false
